name: Build handbook

on:
  workflow_call:
    inputs:
      ref:
        type: string
        default: ""
      upload-pages:
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  build:
    name: Build and check links
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      SITE: https://kakune.github.io
      BASE_PATH: /scioxide
      CARGO_INCREMENTAL: "0"
      CARGO_PROFILE_DEV_DEBUG: "0"
      NODE_OPTIONS: --max-old-space-size=3072
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ inputs.ref || github.sha }}
          persist-credentials: false
      - name: Size build parallelism for the runner
        shell: bash
        run: |
          cores=$(nproc)
          memory_kib=$(awk '/^MemTotal:/ {print $2}' /proc/meminfo)
          # Leave 3 GiB for Node; budget 1.5 GiB per concurrent
          # compile/post-link slot. Oxiquill also uses this Cargo job limit.
          jobs=$(( (memory_kib - 3 * 1024 * 1024) / (1536 * 1024) ))
          (( jobs >= 1 )) || jobs=1
          (( jobs <= cores )) || jobs=$cores
          echo "Runner: $cores CPUs, $memory_kib KiB RAM; build jobs: $jobs"
          echo "CARGO_BUILD_JOBS=$jobs" >> "$GITHUB_ENV"
          # Several modules are optimized while Cargo is still compiling.
          echo "BINARYEN_CORES=1" >> "$GITHUB_ENV"
      - uses: DeterminateSystems/nix-installer-action@c5a866b6ab867e88becbed4467b93592bce69f8a # v21
        with:
          determinate: false
      # Oxiquill verifies source/dependency/toolchain fingerprints and artifact
      # digests before reusing a chapter. Keep its sources, ownership manifest
      # and public Wasm together; caching wasm-opt alone still recompiles Rust.
      # Cache release compiler outputs separately; exclude debug intermediates.
      - name: Restore verified tools and Rust chapter artifacts
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: |
            docs/handbook/.cache/oxiquill
            docs/handbook/.oxiquill/build-cache/wasm-opt
            docs/handbook/.oxiquill/build-cache/rust-workspace.json
            docs/handbook/.oxiquill/rust-cells
            docs/handbook/.oxiquill/generated
            docs/handbook/public/oxiquill/rust-wasm
          key: handbook-v2-${{ runner.os }}-${{ hashFiles('flake.lock', 'docs/handbook/pnpm-lock.yaml', 'rust-toolchain.toml', 'docs/handbook/.cargo/config.toml') }}-${{ inputs.ref || github.sha }}
          restore-keys: |
            handbook-v2-${{ runner.os }}-${{ hashFiles('flake.lock', 'docs/handbook/pnpm-lock.yaml', 'rust-toolchain.toml', 'docs/handbook/.cargo/config.toml') }}-
      - name: Restore Rust release compiler outputs
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: |
            docs/handbook/.oxiquill/build-cache/rust-target/release
            docs/handbook/.oxiquill/build-cache/rust-target/wasm32-unknown-unknown/release
          key: handbook-rust-release-v1-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('flake.lock', 'Cargo.lock', 'docs/handbook/pnpm-lock.yaml', 'rust-toolchain.toml', 'docs/handbook/.cargo/config.toml') }}-${{ inputs.ref || github.sha }}
          restore-keys: |
            handbook-rust-release-v1-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('flake.lock', 'Cargo.lock', 'docs/handbook/pnpm-lock.yaml', 'rust-toolchain.toml', 'docs/handbook/.cargo/config.toml') }}-
      - name: Install locked dependencies
        run: nix develop .#handbook --command pnpm --dir docs/handbook install --frozen-lockfile
      - name: Audit handbook dependencies
        run: nix develop .#handbook --command pnpm --dir docs/handbook audit --prod --audit-level high
      - name: Check chapter navigation
        run: nix develop .#handbook --command node --test docs/handbook/scripts/chapter-sidebar.test.mjs
      # Build includes Astro's checks. Build-mode modules also satisfy test-wasm,
      # so compile once and execute the actual production artifacts afterwards.
      - name: Build production site and validate routes, anchors and redirects
        run: nix develop .#handbook --command pnpm --dir docs/handbook build
      - name: Execute representative English and Japanese production Rust cells
        run: >-
          nix develop .#handbook --command pnpm --dir docs/handbook exec oxiquill test-wasm
          --page en/scioxide-poly/index.mdx --page ja/scioxide-poly/index.mdx
          --all-cases
      - name: Enforce GitHub Pages artifact limits
        run: python3 scripts/checks/pages.py
      - name: Verify licenses in the built site
        run: python3 scripts/checks/licenses.py --site-dir docs/handbook/dist
      - name: Upload site
        if: ${{ inputs.upload-pages }}
        uses: actions/upload-pages-artifact@7b1f4a764d45c48632c6b24a0339c27f5614fb0b # v4
        with:
          path: docs/handbook/dist
          retention-days: 1
