name: Deploy handbook

on:
  # Pushes deploy the artifact from CI; keep an explicit rebuild/redeploy path.
  workflow_dispatch:
  workflow_run:
    workflows: [CI]
    branches: [main]
    types: [completed]

permissions:
  contents: read

# Keep deployments ordered; never cancel a running Pages deployment.
concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  build:
    if: ${{ github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' }}
    uses: ./.github/workflows/handbook.yml
    with:
      upload-pages: true

  reuse:
    name: Reuse validated CI site
    if: >-
      ${{ github.event_name == 'workflow_run' &&
          github.event.workflow_run.event == 'push' &&
          github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      actions: read
    steps:
      - name: Download the site from the triggering CI run
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          CI_RUN_ID: ${{ github.event.workflow_run.id }}
        run: |
          artifact=$(gh api "repos/$GH_REPO/actions/runs/$CI_RUN_ID/artifacts" \
            --jq '.artifacts[] | select(.name == "github-pages" and .expired == false) | .id')
          [[ "$artifact" =~ ^[0-9]+$ ]] || { echo 'Expected exactly one CI Pages artifact' >&2; exit 1; }
          gh api "repos/$GH_REPO/actions/artifacts/$artifact/zip" > site.zip
          unzip site.zip -d artifact
          mkdir site
          tar -xf artifact/artifact.tar -C site
      - name: Stage the verified site for deployment
        uses: actions/upload-pages-artifact@7b1f4a764d45c48632c6b24a0339c27f5614fb0b # v4
        with:
          path: site
          retention-days: 1

  deploy:
    needs: [build, reuse]
    if: ${{ !cancelled() && (needs.build.result == 'success' || needs.reuse.result == 'success') }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Configure GitHub Pages
        uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5
      - name: Deploy handbook
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
