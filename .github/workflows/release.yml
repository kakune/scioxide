name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag to resume (for example v0.1.0)
        required: true
        type: string

permissions:
  contents: read

# Serialize all versions, including retries of a partially published workspace.
concurrency:
  group: crates-io-release
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"
  CARGO_PROFILE_DEV_DEBUG: "0"

jobs:
  prepare:
    name: Validate release tag
    if: ${{ github.repository == 'kakune/scioxide' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      sha: ${{ steps.tag.outputs.sha }}
      tag: ${{ steps.tag.outputs.tag }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Resolve an immutable release commit on main
        id: tag
        env:
          RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          if [[ "$GITHUB_EVENT_NAME" == workflow_dispatch && "$GITHUB_REF" != refs/heads/main ]]; then
            echo 'Resume releases from main only.' >&2
            exit 1
          fi
          if [[ ! "$RELEASE_TAG" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]; then
            echo 'Expected a stable release tag such as v0.1.0.' >&2
            exit 1
          fi
          sha=$(git rev-parse --verify "refs/tags/$RELEASE_TAG^{commit}")
          git merge-base --is-ancestor "$sha" origin/main
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
          echo "tag=$RELEASE_TAG" >> "$GITHUB_OUTPUT"
          git checkout --detach "$sha"
          python3 scripts/checks/release.py --tag "$RELEASE_TAG"

  validate:
    name: Release validation
    needs: prepare
    uses: ./.github/workflows/ci.yml
    with:
      ref: ${{ needs.prepare.outputs.sha }}

  publish:
    name: Publish crates
    needs: [prepare, validate]
    runs-on: ubuntu-latest
    # Creating 19 new crates under the standard quota takes at least 140 minutes.
    timeout-minutes: 240
    environment: crates-io
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ needs.prepare.outputs.sha }}
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@df2a88e9fe4098bad09cb42c3dec7187f15861fc # master
        with:
          toolchain: 1.95.0
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
      - name: Verify every packaged crate before requesting credentials
        run: cargo publish --locked --workspace --registry crates-io --dry-run
      - name: Authenticate using Trusted Publishing
        if: ${{ vars.CRATES_IO_BOOTSTRAP != 'true' }}
        id: auth
        uses: rust-lang/crates-io-auth-action@3268eb413133e2960fa4ae0e963ca76380c54cd9 # v1
      - name: Publish remaining crates and verify registry checksums
        env:
          CARGO_REGISTRY_TOKEN: ${{ vars.CRATES_IO_BOOTSTRAP == 'true' && secrets.CRATES_IO_TOKEN || steps.auth.outputs.token }}
          BOOTSTRAP: ${{ vars.CRATES_IO_BOOTSTRAP }}
        run: |
          if [[ "$BOOTSTRAP" == true ]]; then
            python3 scripts/release/publish.py --execute --bootstrap
          else
            python3 scripts/release/publish.py --execute
          fi

  github-release:
    name: Create GitHub Release
    needs: [prepare, publish]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ needs.prepare.outputs.sha }}
          persist-credentials: false
      - name: Publish release notes after every crate is available
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.prepare.outputs.tag }}
        run: |
          python3 scripts/checks/release.py --tag "$RELEASE_TAG" --notes-file /tmp/release-notes.md
          if gh release view "$RELEASE_TAG" --json isDraft --jq .isDraft > /tmp/is-draft; then
            if [[ "$(cat /tmp/is-draft)" == true ]]; then
              gh release edit "$RELEASE_TAG" --draft=false --notes-file /tmp/release-notes.md --latest
            fi
          else
            gh release create "$RELEASE_TAG" --verify-tag --title "SciOxide $RELEASE_TAG" --notes-file /tmp/release-notes.md --latest
          fi
