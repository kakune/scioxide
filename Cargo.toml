[workspace]
members = [
    "crates/scioxide-core",
    "crates/scioxide-differentiate",
    "crates/scioxide-validated",
    "crates/scioxide-sparse",
    "crates/scioxide-linalg",
    "crates/scioxide-spatial",
    "crates/scioxide-special",
    "crates/scioxide-poly",
    "crates/scioxide-fft",
    "crates/scioxide-signal",
    "crates/scioxide-random",
    "crates/scioxide-stats",
    "crates/scioxide-ad",
    "crates/scioxide-interp",
    "crates/scioxide-rootfind",
    "crates/scioxide-integrate",
    "crates/scioxide-optimize",
    "crates/scioxide-ode",
    "crates/scioxide-pde",
]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.93.0"
license = "MIT OR Apache-2.0"
repository = "https://github.com/kakune/scioxide"
readme = "README.md"
keywords = ["numerical", "scientific", "math", "linear-algebra"]
categories = ["mathematics", "science", "algorithms"]

[workspace.dependencies]
num = "0.4.3"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"

[workspace.lints.rust]
dead_code = "deny"
deprecated = "deny"
unsafe_op_in_unsafe_fn = "deny"
unfulfilled_lint_expectations = "deny"

[workspace.lints.clippy]
# Ambient-state restrictions are enabled by scioxide-ad's production crate root.
disallowed_types = { level = "allow", priority = 1 }
disallowed_macros = { level = "allow", priority = 1 }
disallowed_methods = { level = "allow", priority = 1 }
all = "deny"
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
todo = "deny"
unimplemented = "deny"
dbg_macro = "deny"
needless_range_loop = "deny"
explicit_iter_loop = "deny"
explicit_into_iter_loop = "deny"
manual_ok_or = "deny"
manual_let_else = "deny"
needless_collect = "deny"
unnecessary_to_owned = "deny"
redundant_clone = "deny"
clone_on_ref_ptr = "deny"
undocumented_unsafe_blocks = "deny"

[profile.release]
lto = "fat"
codegen-units = 1
