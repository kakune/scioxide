msrv = "1.93.0"
allow-unwrap-in-tests = true
allow-expect-in-tests = true
# Clippy rejects Err variants of at least this many bytes; 64-byte errors stay within
# the SciOxideError budget asserted in scioxide-core (crates/scioxide-core/src/error.rs).
large-error-threshold = 65

# Enabled by scioxide-ad for production code only.
disallowed-types = [
    { path = "alloc::rc::Rc", reason = "AD state belongs to explicit caller workspaces" },
    { path = "core::cell::RefCell", reason = "AD state is borrowed explicitly" },
    { path = "std::thread::LocalKey", reason = "AD has no ambient thread-local state" },
    { path = "core::sync::atomic::AtomicBool", reason = "AD correctness cannot depend on global counters or atomics" },
    { path = "core::sync::atomic::AtomicI8", reason = "AD correctness cannot depend on global counters or atomics" },
    { path = "core::sync::atomic::AtomicI16", reason = "AD correctness cannot depend on global counters or atomics" },
    { path = "core::sync::atomic::AtomicI32", reason = "AD correctness cannot depend on global counters or atomics" },
    { path = "core::sync::atomic::AtomicI64", reason = "AD correctness cannot depend on global counters or atomics" },
    { path = "core::sync::atomic::AtomicIsize", reason = "AD correctness cannot depend on global counters or atomics" },
    { path = "core::sync::atomic::AtomicU8", reason = "AD correctness cannot depend on global counters or atomics" },
    { path = "core::sync::atomic::AtomicU16", reason = "AD correctness cannot depend on global counters or atomics" },
    { path = "core::sync::atomic::AtomicU32", reason = "AD correctness cannot depend on global counters or atomics" },
    { path = "core::sync::atomic::AtomicU64", reason = "AD correctness cannot depend on global counters or atomics" },
    { path = "core::sync::atomic::AtomicUsize", reason = "AD correctness cannot depend on global counters or atomics" },
    { path = "core::sync::atomic::AtomicPtr", reason = "AD correctness cannot depend on global counters or atomics" },
]
disallowed-macros = [
    { path = "std::thread_local", reason = "AD state belongs to explicit caller workspaces" },
]
disallowed-methods = [
    { path = "std::panic::catch_unwind", reason = "AD failures use structured Result errors" },
    { path = "std::panic::resume_unwind", reason = "AD failures use structured Result errors" },
]
