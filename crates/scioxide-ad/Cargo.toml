[package]
name = "scioxide-ad"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
description = "Forward and reverse automatic differentiation"
documentation = "https://docs.rs/scioxide-ad"
license.workspace = true
repository.workspace = true
readme = "README.md"
keywords.workspace = true
categories.workspace = true

[package.metadata.docs.rs]
all-features = true

[features]
default = ["std"]
std = ["scioxide-core/std", "scioxide-linalg/std", "scioxide-sparse/std"]

[dependencies]
scioxide-core = { path = "../scioxide-core", version = "0.1.0", default-features = false }
scioxide-linalg = { path = "../scioxide-linalg", version = "0.1.0", default-features = false }
scioxide-sparse = { path = "../scioxide-sparse", version = "0.1.0", default-features = false }

[dev-dependencies]

[lints]
workspace = true

