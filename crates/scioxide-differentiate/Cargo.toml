[package]
name = "scioxide-differentiate"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
description = "Numerical differentiation and derivative selection for SciOxide"
documentation = "https://docs.rs/scioxide-differentiate"
license.workspace = true
repository.workspace = true
readme = "README.md"
keywords.workspace = true
categories.workspace = true

[features]
default = ["std"]
std = ["scioxide-core/std"]

[dependencies]
scioxide-core = { path = "../scioxide-core", version = "0.1.0", default-features = false }

[dev-dependencies]
scioxide-linalg = { path = "../scioxide-linalg", default-features = false }
scioxide-sparse = { path = "../scioxide-sparse", default-features = false }

[lints]
workspace = true
