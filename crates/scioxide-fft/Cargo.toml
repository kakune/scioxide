[package]
name = "scioxide-fft"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
description = "Planned FFT/IFFT, DCT/DST, and transform utilities"
documentation = "https://docs.rs/scioxide-fft"
license.workspace = true
repository.workspace = true
readme = "README.md"
keywords.workspace = true
categories.workspace = true

[features]
default = ["std"]
std = ["scioxide-core/std", "scioxide-linalg/std", "scioxide-special/std"]

[dependencies]
scioxide-core = { path = "../scioxide-core", version = "0.1.0", default-features = false }
scioxide-linalg = { path = "../scioxide-linalg", version = "0.1.0", default-features = false }

scioxide-special = { path = "../scioxide-special", version = "0.1.0", default-features = false }

[dev-dependencies]
# Independent reference decoding stays test-only. lib.rs includes the
# workspace tool's reference loader as source, without a Cargo tool dependency.
serde.workspace = true
serde_json.workspace = true

[lints]
workspace = true
