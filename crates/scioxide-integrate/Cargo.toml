[package]
name = "scioxide-integrate"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
description = "1D and multi-dimensional numerical integration"
documentation = "https://docs.rs/scioxide-integrate"
license.workspace = true
repository.workspace = true
readme = "README.md"
keywords.workspace = true
categories.workspace = true

[features]
default = ["std"]
std = ["scioxide-core/std", "scioxide-linalg/std", "scioxide-poly/std", "scioxide-random/std", "scioxide-spatial/std", "scioxide-stats/std"]

[dependencies]
scioxide-linalg = { path = "../scioxide-linalg", version = "0.1.0", default-features = false }
scioxide-core = { path = "../scioxide-core", version = "0.1.0", default-features = false }
scioxide-poly = { path = "../scioxide-poly", version = "0.1.0", default-features = false }
scioxide-random = { path = "../scioxide-random", version = "0.1.0", default-features = false }
scioxide-spatial = { path = "../scioxide-spatial", version = "0.1.0", default-features = false }
scioxide-stats = { path = "../scioxide-stats", version = "0.1.0", default-features = false }

[dev-dependencies]
scioxide-sparse = { path = "../scioxide-sparse", version = "0.1.0", default-features = false }
scioxide-ad = { path = "../scioxide-ad", version = "0.1.0", default-features = false }
scioxide-special = { path = "../scioxide-special", version = "0.1.0", default-features = false }

[lints]
workspace = true
