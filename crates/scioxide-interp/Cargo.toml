[package]
name = "scioxide-interp"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
description = "Interpolation, tensor and rational splines, local models, and fixed-covariance kriging"
documentation = "https://docs.rs/scioxide-interp"
license.workspace = true
repository.workspace = true
readme = "README.md"
keywords.workspace = true
categories.workspace = true

[features]
default = ["std"]
std = ["scioxide-core/std", "scioxide-linalg/std", "scioxide-poly/std", "scioxide-spatial/std"]

[dependencies]
scioxide-core = { path = "../scioxide-core", version = "0.1.0", default-features = false }
scioxide-linalg = { path = "../scioxide-linalg", version = "0.1.0", default-features = false }
scioxide-poly = { path = "../scioxide-poly", version = "0.1.0", default-features = false }

scioxide-spatial = { path = "../scioxide-spatial", version = "0.1.0", default-features = false }

[dev-dependencies]

[lints]
workspace = true
