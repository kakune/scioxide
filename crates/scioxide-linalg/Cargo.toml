[package]
name = "scioxide-linalg"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
description = "Dense matrices, decompositions, and iterative solvers for SciOxide"
documentation = "https://docs.rs/scioxide-linalg"
license.workspace = true
repository.workspace = true
readme = "README.md"
keywords.workspace = true
categories.workspace = true

[package.metadata.docs.rs]
all-features = true

[features]
default = ["std"]
std = ["scioxide-core/std", "scioxide-sparse/std"]
blas = []

[dependencies]
scioxide-core = { path = "../scioxide-core", version = "0.1.0", default-features = false }
scioxide-sparse = { path = "../scioxide-sparse", version = "0.1.0", default-features = false }

[dev-dependencies]
proc-macro2 = "1.0.106"
quote = "1.0.44"
syn = { version = "2.0.117", features = ["full"] }

[lints]
workspace = true
