[package]
name = "scioxide-ode"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
description = "IVP and collocation BVP ODE solvers with events and adaptivity"
documentation = "https://docs.rs/scioxide-ode"
license.workspace = true
repository.workspace = true
readme = "README.md"
keywords.workspace = true
categories.workspace = true

[features]
default = ["std"]
std = ["scioxide-sparse/std", "scioxide-differentiate/std", "scioxide-core/std", "scioxide-linalg/std", "scioxide-rootfind/std", "scioxide-ad/std"]

[dependencies]
scioxide-sparse = { path = "../scioxide-sparse", version = "0.1.0", default-features = false }
scioxide-differentiate = { path = "../scioxide-differentiate", version = "0.1.0", default-features = false }
scioxide-ad = { path = "../scioxide-ad", version = "0.1.0", default-features = false }
scioxide-core = { path = "../scioxide-core", version = "0.1.0", default-features = false }
scioxide-linalg = { path = "../scioxide-linalg", version = "0.1.0", default-features = false }

scioxide-rootfind = { path = "../scioxide-rootfind", version = "0.1.0", default-features = false }

[dev-dependencies]
scioxide-random = { path = "../scioxide-random", default-features = false }

[lints]
workspace = true
