[package]
name = "scioxide-optimize"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
description = "Unconstrained, constrained, and global optimization"
documentation = "https://docs.rs/scioxide-optimize"
license.workspace = true
repository.workspace = true
readme = "README.md"
keywords.workspace = true
categories.workspace = true

[features]
default = ["std"]
std = ["scioxide-differentiate/std", "scioxide-core/std", "scioxide-interp/std", "scioxide-linalg/std", "scioxide-random/std", "scioxide-sparse/std", "scioxide-spatial/std", "scioxide-special/std", "scioxide-stats/std"]

[dependencies]
scioxide-differentiate = { path = "../scioxide-differentiate", version = "0.1.0", default-features = false }
scioxide-stats = { path = "../scioxide-stats", version = "0.1.0", default-features = false }
scioxide-core = { path = "../scioxide-core", version = "0.1.0", default-features = false }
scioxide-interp = { path = "../scioxide-interp", version = "0.1.0", default-features = false }
scioxide-linalg = { path = "../scioxide-linalg", version = "0.1.0", default-features = false }
scioxide-random = { path = "../scioxide-random", version = "0.1.0", default-features = false }
scioxide-sparse = { path = "../scioxide-sparse", version = "0.1.0", default-features = false }
scioxide-spatial = { path = "../scioxide-spatial", version = "0.1.0", default-features = false }
scioxide-special = { path = "../scioxide-special", version = "0.1.0", default-features = false }

[dev-dependencies]
# Independent oracle arithmetic/decoding stays test-only; no tool back-edge.
num.workspace = true
serde.workspace = true
serde_json.workspace = true

[lints]
workspace = true
