[package]
name = "scioxide-pde"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
description = "PDE discretization (FDM/FEM/FVM) and solvers"
documentation = "https://docs.rs/scioxide-pde"
license.workspace = true
repository.workspace = true
readme = "README.md"
keywords.workspace = true
categories.workspace = true

[features]
default = ["std"]
std = ["scioxide-sparse/std", "scioxide-differentiate/std", "scioxide-ad/std", "scioxide-core/std", "scioxide-linalg/std", "scioxide-ode/std", "scioxide-spatial/std", "scioxide-integrate/std", "scioxide-poly/std", "scioxide-rootfind/std"]

[dependencies]
scioxide-sparse = { path = "../scioxide-sparse", version = "0.1.0", default-features = false }
scioxide-differentiate = { path = "../scioxide-differentiate", version = "0.1.0", default-features = false }
scioxide-ad = { path = "../scioxide-ad", version = "0.1.0", default-features = false }
scioxide-rootfind = { path = "../scioxide-rootfind", version = "0.1.0", default-features = false }
scioxide-integrate = { path = "../scioxide-integrate", version = "0.1.0", default-features = false }
scioxide-poly = { path = "../scioxide-poly", version = "0.1.0", default-features = false }
scioxide-spatial = { path = "../scioxide-spatial", version = "0.1.0", default-features = false }
scioxide-core = { path = "../scioxide-core", version = "0.1.0", default-features = false }
scioxide-linalg = { path = "../scioxide-linalg", version = "0.1.0", default-features = false }
scioxide-ode = { path = "../scioxide-ode", version = "0.1.0", default-features = false }

[dev-dependencies]

[lints]
workspace = true
