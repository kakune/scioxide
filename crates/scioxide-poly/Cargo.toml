[package]
name = "scioxide-poly"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
description = "Exact algebra and basis-aware approximate polynomials with diagnostics"
documentation = "https://docs.rs/scioxide-poly"
license.workspace = true
repository.workspace = true
readme = "README.md"
keywords.workspace = true
categories.workspace = true

[features]
default = ["std"]
std = ["scioxide-core/std", "scioxide-linalg/std", "scioxide-special/std", "scioxide-fft/std"]

[dependencies]
scioxide-fft = { path = "../scioxide-fft", version = "0.1.0", default-features = false }
scioxide-core = { path = "../scioxide-core", version = "0.1.0", default-features = false }
scioxide-linalg = { path = "../scioxide-linalg", version = "0.1.0", default-features = false }

scioxide-special = { path = "../scioxide-special", version = "0.1.0", default-features = false }

[dev-dependencies]

[lints]
workspace = true
