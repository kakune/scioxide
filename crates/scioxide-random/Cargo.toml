[package]
name = "scioxide-random"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
description = "PRNG engines, distributions, quasi-random sequences, and sampling"
documentation = "https://docs.rs/scioxide-random"
license.workspace = true
repository.workspace = true
readme = "README.md"
keywords.workspace = true
categories.workspace = true

[package.metadata.docs.rs]
all-features = true

[features]
default = ["std"]
std = ["scioxide-differentiate/std", "scioxide-core/std", "scioxide-linalg/std", "scioxide-special/std", "scioxide-rootfind/std"]

[dependencies]
scioxide-differentiate = { path = "../scioxide-differentiate", version = "0.1.0", default-features = false }
scioxide-rootfind = { path = "../scioxide-rootfind", version = "0.1.0", default-features = false }
scioxide-core = { path = "../scioxide-core", version = "0.1.0", default-features = false }
scioxide-linalg = { path = "../scioxide-linalg", version = "0.1.0", default-features = false }
scioxide-special = { path = "../scioxide-special", version = "0.1.0", default-features = false }

[dev-dependencies]

[lints]
workspace = true

[[example]]
name = "stream_partitioning"
required-features = ["std"]
