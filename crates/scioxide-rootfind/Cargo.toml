[package]
name = "scioxide-rootfind"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
description = "Scalar, system, and polynomial root finding"
documentation = "https://docs.rs/scioxide-rootfind"
license.workspace = true
repository.workspace = true
readme = "README.md"
keywords.workspace = true
categories.workspace = true

[features]
default = ["std"]
std = ["scioxide-differentiate/std", "scioxide-core/std", "scioxide-linalg/std", "scioxide-poly/std", "scioxide-special/std"]

[dependencies]
scioxide-differentiate = { path = "../scioxide-differentiate", version = "0.1.0", default-features = false }
scioxide-special = { path = "../scioxide-special", version = "0.1.0", default-features = false }
scioxide-core = { path = "../scioxide-core", version = "0.1.0", default-features = false }
scioxide-linalg = { path = "../scioxide-linalg", version = "0.1.0", default-features = false }
scioxide-poly = { path = "../scioxide-poly", version = "0.1.0", default-features = false }

[dev-dependencies]
scioxide-sparse = { path = "../scioxide-sparse", version = "0.1.0", default-features = false }
scioxide-fft = { path = "../scioxide-fft", version = "0.1.0", default-features = false }

[lints]
workspace = true
