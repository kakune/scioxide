[package]
name = "scioxide-signal"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
description = "Signal transforms, filters, streaming, and dense continuous/discrete LTI systems"
documentation = "https://docs.rs/scioxide-signal"
license.workspace = true
repository.workspace = true
readme = "README.md"
keywords.workspace = true
categories.workspace = true

[features]
default = ["std"]
std = ["scioxide-core/std", "scioxide-linalg/std", "scioxide-fft/std", "scioxide-special/std", "scioxide-interp/std", "scioxide-rootfind/std", "scioxide-poly/std"]

[dependencies]
scioxide-poly = { path = "../scioxide-poly", version = "0.1.0", default-features = false }
scioxide-rootfind = { path = "../scioxide-rootfind", version = "0.1.0", default-features = false }
scioxide-interp = { path = "../scioxide-interp", version = "0.1.0", default-features = false }
scioxide-special = { path = "../scioxide-special", version = "0.1.0", default-features = false }
scioxide-fft = { path = "../scioxide-fft", version = "0.1.0", default-features = false }
scioxide-core = { path = "../scioxide-core", version = "0.1.0", default-features = false }
scioxide-linalg = { path = "../scioxide-linalg", version = "0.1.0", default-features = false }

[dev-dependencies]

[lints]
workspace = true
