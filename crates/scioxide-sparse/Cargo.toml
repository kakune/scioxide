[package]
name = "scioxide-sparse"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
description = "Canonical sparse storage, kernels, and preconditioners for SciOxide"
documentation = "https://docs.rs/scioxide-sparse"
license.workspace = true
repository.workspace = true
readme = "README.md"
keywords.workspace = true
categories.workspace = true

[features]
default = ["std"]
std = ["scioxide-core/std"]

[dependencies]
scioxide-core = { path = "../scioxide-core", version = "0.1.0", default-features = false }

[dev-dependencies]
scioxide-differentiate = { path = "../scioxide-differentiate", default-features = false }

[lints]
workspace = true
