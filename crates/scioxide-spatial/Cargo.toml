[package]
name = "scioxide-spatial"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
description = "Geometry, topology, distance metrics, and borrowed KD-tree search for SciOxide"
documentation = "https://docs.rs/scioxide-spatial"
license.workspace = true
repository.workspace = true
readme = "README.md"
keywords.workspace = true
categories.workspace = true

[features]
default = ["std"]
std = ["scioxide-core/std", "scioxide-linalg/std"]

[dependencies]
scioxide-core = { path = "../scioxide-core", version = "0.1.0", default-features = false }
scioxide-linalg = { path = "../scioxide-linalg", version = "0.1.0", default-features = false }

[dev-dependencies]
num.workspace = true

[lints]
workspace = true
