[package]
name = "scioxide-special"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
description = "Special functions (gamma, bessel, error, elliptic, airy) for SciOxide"
documentation = "https://docs.rs/scioxide-special"
license.workspace = true
repository.workspace = true
readme = "README.md"
keywords.workspace = true
categories.workspace = true
# Keep the large integration fixtures in the repository. Retain the reference
# data used by unit tests in src so the published library tests remain runnable.
exclude = [
    "/tests/*.rs",
    "/tests/data/*.tsv",
    "!/tests/data/wide_elementary.tsv",
    "!/tests/data/wide_constants.tsv",
    "!/tests/data/ellipsoidal.tsv",
    "!/tests/data/ellipsoidal_complex.tsv",
]

[features]
default = ["std"]
std = ["scioxide-core/std", "scioxide-linalg/std"]

[dependencies]
scioxide-core = { path = "../scioxide-core", version = "0.1.0", default-features = false }
scioxide-linalg = { path = "../scioxide-linalg", version = "0.1.0", default-features = false }

[dev-dependencies]
proc-macro2 = "1.0.106"
syn = { version = "2.0.117", features = ["full"] }

[lints]
workspace = true
