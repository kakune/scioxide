[package]
name = "scioxide-stats"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
description = "Validated online statistics and exact empirical distributions"
documentation = "https://docs.rs/scioxide-stats"
license.workspace = true
repository.workspace = true
readme = "README.md"
keywords.workspace = true
categories.workspace = true

[features]
default = ["std"]
std = ["scioxide-core/std", "scioxide-linalg/std", "scioxide-special/std", "scioxide-random/std", "scioxide-signal/std", "scioxide-rootfind/std"]

[dependencies]
scioxide-rootfind = { path = "../scioxide-rootfind", version = "0.1.0", default-features = false }
scioxide-signal = { path = "../scioxide-signal", version = "0.1.0", default-features = false }
scioxide-random = { path = "../scioxide-random", version = "0.1.0", default-features = false }
scioxide-core = { path = "../scioxide-core", version = "0.1.0", default-features = false }
scioxide-linalg = { path = "../scioxide-linalg", version = "0.1.0", default-features = false }
scioxide-special = { path = "../scioxide-special", version = "0.1.0", default-features = false }

[dev-dependencies]
scioxide-sparse = { path = "../scioxide-sparse", version = "0.1.0", default-features = false }

[lints]
workspace = true
