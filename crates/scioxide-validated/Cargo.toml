[package]
name = "scioxide-validated"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
description = "Certified interval and real/complex affine arithmetic with explicit resource budgets"
documentation = "https://docs.rs/scioxide-validated"
license.workspace = true
repository.workspace = true
readme = "README.md"
keywords.workspace = true
categories.workspace = true

[features]
default = ["std"]
std = ["scioxide-core/std", "scioxide-linalg/std", "scioxide-sparse/std"]

[dependencies]
scioxide-core = { path = "../scioxide-core", version = "0.1.0", default-features = false }

scioxide-linalg = { path = "../scioxide-linalg", version = "0.1.0", default-features = false }
scioxide-sparse = { path = "../scioxide-sparse", version = "0.1.0", default-features = false }

[dev-dependencies]
scioxide-rootfind = { path = "../scioxide-rootfind", default-features = false, features = ["std"] }

[lints]
workspace = true
